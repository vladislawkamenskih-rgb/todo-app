<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#5b5bd6">
  <title>Мої завдання</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- Верхня панель -->
    <header class="topbar">
      <div class="topbar__brand">
        <div class="topbar__logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>
        </div>
        <div>
          <h1 class="topbar__title">Мої завдання</h1>
          <p class="topbar__date" id="today"></p>
        </div>
      </div>
      <p class="topbar__counter" id="counter" aria-live="polite"></p>
    </header>

    <div class="layout">
      <!-- Статистика та прогрес -->
      <aside class="sidebar panel" aria-labelledby="stats-title">
        <h2 class="panel__title" id="stats-title">Статистика</h2>

        <div class="stats">
          <div class="stat">
            <span class="stat__value" id="stat-total">0</span>
            <span class="stat__label">Всього</span>
          </div>
          <div class="stat stat--active">
            <span class="stat__value" id="stat-active">0</span>
            <span class="stat__label">Активні</span>
          </div>
          <div class="stat stat--completed">
            <span class="stat__value" id="stat-completed">0</span>
            <span class="stat__label">Виконані</span>
          </div>
        </div>

        <div class="progress-block">
          <div class="progress-block__header">
            <span>Прогрес</span>
            <span class="progress-block__percent" id="progress-percent">0%</span>
          </div>
          <div class="progress" id="progress" role="progressbar" aria-label="Прогрес виконання" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="progress__fill" id="progress-fill"></div>
          </div>
          <p class="progress-block__caption" id="progress-caption"></p>
        </div>

        <button class="button button--danger" id="clear-completed" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>
          Очистити виконані
        </button>
      </aside>

      <!-- Список завдань -->
      <main class="content panel">
        <form class="add-form" id="add-form" autocomplete="off">
          <input
            class="field add-form__input"
            id="new-todo"
            type="text"
            placeholder="Що потрібно зробити?"
            maxlength="200"
            aria-label="Нове завдання"
          >
          <select class="field field--select" id="new-priority" aria-label="Пріоритет" title="Пріоритет">
            <option value="low">Низький</option>
            <option value="medium" selected>Середній</option>
            <option value="high">Високий</option>
          </select>
          <input class="field field--date" id="new-due" type="date" aria-label="Термін виконання" title="Термін виконання">
          <button class="button button--primary add-form__button" type="submit">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            Додати
          </button>
        </form>

        <div class="toolbar">
          <h2 class="toolbar__title" id="list-title">Усі завдання</h2>
          <nav class="filters" aria-label="Фільтр завдань">
            <button class="filters__button is-active" type="button" data-filter="all">Усі</button>
            <button class="filters__button" type="button" data-filter="active">Активні</button>
            <button class="filters__button" type="button" data-filter="completed">Виконані</button>
          </nav>
        </div>

        <ul class="todo-list" id="todo-list"></ul>

        <div class="empty-state" id="empty-state" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
          <p id="empty-text"></p>
        </div>
      </main>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
