services:
  - type: web
    name: todo-app
    runtime: static
    # Проект — статический сайт без сборки: копируем в public только файлы для браузера,
    # чтобы не опубликовать лишнее (например, папку .git)
    buildCommand: mkdir -p public && cp index.html app.js style.css public/
    staticPublishPath: public
